[project]
name = "sb-agents"
version = "0.1.0"
description = "Small Business Agent Suite: Stock, Cash-Flow and Accountant agents under one self-correcting LangGraph harness"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0.30",
    "alembic>=1.13",
    "aiosqlite>=0.20",
    "langgraph>=1.0",
    "langgraph-checkpoint-sqlite>=2.0",
    "anthropic>=0.60",
    "python-telegram-bot>=21",
    "pandas>=2.2",
    "statsmodels>=0.14",
    "hijridate>=2.5",
    "argon2-cffi>=23.1",
    "python-multipart>=0.0.9",
    "sse-starlette>=2.1",
    "reportlab>=4.2",
    "arabic-reshaper>=3.0",
    "python-bidi>=0.4",
    "pillow>=10.4",
    "itsdangerous>=2.2",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "schemathesis>=3.30",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.File", "fastapi.Form"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "app.*"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "llm_live: calls the live Anthropic API and spends credit (run explicitly)",
    "slow: long-running replay or metrics tests",
]
addopts = "-m 'not llm_live and not slow'"
